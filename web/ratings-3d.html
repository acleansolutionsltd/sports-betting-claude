<title>Ratings Landscape</title>
<style>

      --home: #5aa9ff; --away: #ff9a56; --draw: #6b7585; --good: #3ecf8e; --warn: #f0b429; --bad: #ef6a6a;
      --floor: #121720; --grid: #2a3240; --focus: #5aa9ff;

    --bg: #0d1015; --panel: #151a22; --ink: #e6e9ef; --muted: #8b94a3; --line: #262d39;
    --home: #5aa9ff; --away: #ff9a56; --draw: #6b7585; --good: #3ecf8e; --warn: #f0b429; --bad: #ef6a6a;

  th, td { padding: 5px 3px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: 11px; color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; }
  th[aria-sort] { color: var(--ink); }
  .tw { overflow-x: auto; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
  tr.sel-home td:first-child { box-shadow: inset 3px 0 var(--home); }
  tr.sel-away td:first-child { box-shadow: inset 3px 0 var(--away); }
  .pos { color: var(--good); } .neg { color: var(--bad); }

  .field label { font-size: 12px; color: var(--muted); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  select, input[type="text"] { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
  input[type="range"] { width: 100%; accent-color: var(--home); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0 0 8px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .big { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .warn { border: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); border-radius: 8px;
          padding: 8px 10px; margin: 10px 0; font-size: 12.5px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 12px; }
  .cand { color: var(--good); font-weight: 650; }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
  .btn { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 56vh auto; height: auto; min-height: 100%; }
    aside { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
    .meta { margin-left: 0; text-align: left; }
  }
</style>

</div>

  const home = col("--home"), bad = col("--bad"), good = col("--good"), draw = col("--draw");

  for (const t of teams) {
    const h = (t.net / maxNet) * 3.2, ah = Math.max(Math.abs(h), 0.06);
    const shrink = d.lam_main / (t.gp + d.lam_main);            // share of the rating still coming from the prior
    const base = t.net >= 0 ? draw.clone().lerp(good, Math.min(t.net / maxNet, 1)) : draw.clone().lerp(bad, Math.min(-t.net / maxNet, 1));
    const mat = new THREE.MeshStandardMaterial({ color: base, roughness: 0.55, metalness: 0.05 });
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.42, ah, 0.42), mat);
    m.position.set(X(t), h >= 0 ? ah / 2 : -ah / 2, Z(t));
    m.userData = { id: t.id, base: base.clone() };
    dyn.add(m); pickables.push(m);

    const ring = new THREE.Mesh(new THREE.RingGeometry(0.3, 0.3 + 0.6 * shrink, 40),
      new THREE.MeshBasicMaterial({ color: draw, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false }));
    ring.rotation.x = -Math.PI / 2; ring.position.set(X(t), 0.015, Z(t));
    dyn.add(ring);

    const lp = new THREE.Vector3(X(t), Math.max(h, 0) + 0.45, Z(t));
    const l = addLabel(t.short, lp);
    l.id = t.id;
  }
  // axes
  const ax = (a, b) => {
    const g = new THREE.BufferGeometry().setFromPoints([a, b]);
    dyn.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: col("--muted") })));
  };
  ax(new THREE.Vector3(-6, 0.01, 0), new THREE.Vector3(6, 0.01, 0));
  ax(new THREE.Vector3(0, 0.01, -6), new THREE.Vector3(0, 0.01, 6));
  addLabel("Better attack →", new THREE.Vector3(5.2, 0.1, 0.6), "axis");
  addLabel("← Weaker attack", new THREE.Vector3(-5.2, 0.1, 0.6), "axis");
  addLabel("Better defence (far side) ↑", new THREE.Vector3(1.2, 0.1, -6.3), "axis");
  addLabel("Weaker defence (near side) ↓", new THREE.Vector3(1.4, 0.1, 6.3), "axis");
  document.getElementById("hint").textContent =
    "Height = net rating (attack + defence). Far-right = best. Rings show how much of a rating is still last season's — wide ring = few games. Click two teams to compare.";
  styleSelection();
  dirty = true;
}

/* ───────────── matchup ───────────── */
let matchResult = null;
function buildMatchup() {
  clearDyn();
  matchResult = null;
  const { home, away } = state;
  if (!home || !away || home === away) { floorAndGrid(7, 14); document.getElementById("hint").textContent = "Pick a home and an away team in the panel (or click two teams in the landscape)."; dirty = true; return; }
  const d = sportData();
  const neutral = !!state.inputs.neutral;
  const pj = project(home, away, neutral);
  if (state.sport === "epl") buildScoreSurface(pj);
  else buildMarginRibbon(pj, neutral);
  dirty = true;
}
function buildScoreSurface(pj) {
  const lh = Math.max(pj.hs, 0.15), la = Math.max(pj.as, 0.15), N = 7;
  const g = scoreGrid(lh, la, 10);
  floorAndGrid(5, 10);
  let max = 0; for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) max = Math.max(max, g[i][j]);
  const sc = 3.4 / max, hc = col("--home"), ac = col("--away"), dc = col("--draw");
  const step = 1.0, off = -(N * step) / 2;
  for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
    const p = g[i][j], h = Math.max(p * sc, 0.02);
    const c = i > j ? hc : i < j ? ac : dc;
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.78, h, 0.78),
      new THREE.MeshStandardMaterial({ color: c, roughness: 0.5, transparent: true, opacity: p > 0.002 ? 1 : 0.35 }));
    m.position.set(off + i * step, h / 2, off + j * step);
    dyn.add(m);
    if (p >= max * 0.55) addLabel(i + "–" + j, new THREE.Vector3(off + i * step, h + 0.3, off + j * step), "tick");
  }
  const d = sportData();
  const nearZ = off + N * step + 0.9, nearX = off + N * step + 0.9;
  for (let k = 0; k <= N; k++) {
    addLabel(String(k), new THREE.Vector3(off + k * step, 0.05, nearZ), "tick");
    addLabel(String(k), new THREE.Vector3(nearX, 0.05, off + k * step), "tick");
  }
  addLabel(`${d.teams[state.home].short} goals →`, new THREE.Vector3(0, 0.05, nearZ + 1.0), "axis");
  addLabel(`${d.teams[state.away].short} goals →`, new THREE.Vector3(nearX + 1.6, 0.05, 0), "axis");
  cam.target.set(0, 0.8, 0);
  document.getElementById("hint").textContent =
    "Each bar is one exact scoreline. Blue = home win, orange = away win, grey = draw (the diagonal). Taller = more likely.";
}
function buildMarginRibbon(pj, neutral) {
  const d = sportData(), sd = d.sd_margin, margin = pj.hs - pj.as;
  floorAndGrid(8, 16);
  const lo = -30, hi = 30, w = 0.26, hc = col("--home"), ac = col("--away");
  const pdf = (x) => Math.exp(-0.5 * ((x - margin) / sd) ** 2) / (sd * Math.sqrt(2 * Math.PI));
  const sc = 4.2 / pdf(margin), x0 = -((hi - lo) * w) / 2;
  const X = (m) => x0 + (m - lo) * w;
  for (let m = lo; m <= hi; m++) {
    const h = Math.max(pdf(m) * sc, 0.02);
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w * 0.88, h, 1.1),
      new THREE.MeshStandardMaterial({ color: m > 0 ? hc : ac, roughness: 0.5 }));
    mesh.position.set(X(m), h / 2, 0);
    dyn.add(mesh);
  }
  const marker = (m, color, text, z) => {
    const x = X(Math.max(lo, Math.min(hi, m)));
    const mk = new THREE.Mesh(new THREE.BoxGeometry(0.07, 5.2, 0.07), new THREE.MeshBasicMaterial({ color }));
    mk.position.set(x, 2.6, 0.7); dyn.add(mk);
    addLabel(text, new THREE.Vector3(x, 5.5 + z, 0.7), "");
  };
  marker(margin, col("--ink"), `model ${sgn(margin)}`, 0);
  const mm = marketMargin();
  if (mm != null) marker(mm.margin, col("--warn"), `market ${sgn(mm.margin)}`, 0.6);
  marker(0, col("--muted"), "level", 1.0);
  for (let m = -28; m <= 28; m += 7) addLabel(String(m), new THREE.Vector3(X(m), 0.05, 1.4), "tick");
  addLabel(`← ${d.teams[state.away].short} win by (points)`, new THREE.Vector3(X(-20), 0.05, 2.4), "axis");
  addLabel(`${d.teams[state.home].short} win by (points) →`, new THREE.Vector3(X(20), 0.05, 2.4), "axis");
  cam.target.set(0, 1.8, 0);
  document.getElementById("hint").textContent =
    "The bars are the spread of likely margins (NFL results vary by ~13 points either way). Where the model and market markers sit apart is where the question is.";
}

/* ───────────── selection / picking ───────────── */
function styleSelection() {
  if (state.view !== "land") return;
  for (const m of pickables) {
    const id = m.userData.id;
    const c = id === state.home ? col("--home") : id === state.away ? col("--away") : m.userData.base;
    m.material.color.copy(c);
    m.material.emissive = new THREE.Color(id === state.hover ? 0x333333 : 0x000000);
  }
  for (const l of labels) {
    l.el.classList.toggle("sel-home", l.id != null && l.id === state.home);
    l.el.classList.toggle("sel-away", l.id != null && l.id === state.away);
  }
  dirty = true;
}
function selectTeam(id) {
  if (!state.home || (state.home && state.away)) { state.home = id; state.away = null; }
  else if (id !== state.home) { state.away = id; }
  renderPanel(); styleSelection();
}
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
function pick(ev) {
  if (!pickables.length) return null;
  const r = canvas.getBoundingClientRect();
  ptr.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(pickables)[0];
  return hit ? hit.object.userData.id : null;
}

/* ───────────── camera input (drag to orbit, wheel / pinch to zoom) ───────────── */
const pts = new Map();
let down = null, pinch = 0;
canvas.addEventListener("pointerdown", (e) => {
  canvas.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  down = { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 };
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); }
});
canvas.addEventListener("pointermove", (e) => {
  const p = pts.get(e.pointerId);
  if (!p) { hover(e); return; }
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pts.size === 2) {
    const [a, b] = [...pts.values()], dist = Math.hypot(a.x - b.x, a.y - b.y);
    cam.radius = Math.min(40, Math.max(5, cam.radius * (pinch / dist))); pinch = dist;
  } else {
    cam.theta -= dx * 0.006;
    cam.phi = Math.min(1.5, Math.max(0.15, cam.phi - dy * 0.006));
  }
  if (down) down.moved += Math.abs(dx) + Math.abs(dy);
  dirty = true;
});
const end = (e) => {
  pts.delete(e.pointerId);
  if (down && pts.size === 0 && down.moved < 5 && performance.now() - down.t < 600 && state.view === "land") {
    const id = pick(e); if (id) selectTeam(id);
  }
  if (pts.size === 0) down = null;
};
canvas.addEventListener("pointerup", end);
canvas.addEventListener("pointercancel", end);
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  cam.radius = Math.min(40, Math.max(5, cam.radius * Math.exp(e.deltaY * 0.0012))); dirty = true;
}, { passive: false });

const tip = document.getElementById("tip");
function hover(e) {
  if (state.view !== "land") { tip.style.display = "none"; return; }
  const id = pick(e);
  if (id !== state.hover) { state.hover = id; styleSelection(); }
  if (!id) { tip.style.display = "none"; return; }
  const t = teamList().find((x) => x.id === id), u = sportData().unit;
  tip.innerHTML = `<b>${t.name}</b><span>${t.gp} games</span><br>Attack ${sgn(t.off, 2)} ${u}<br>Defence ${sgn(t.def, 2)} ${u}<br>Net ${sgn(t.net, 2)}<br>
    <span>Home/away: attack ${sgn(t.oh, 2)}, defence ${sgn(-t.dh, 2)} (shrunk to near zero)</span>`;
  const r = canvas.getBoundingClientRect();
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX - r.left + 14, r.width - 220) + "px";
  tip.style.top = Math.max(e.clientY - r.top - 10, 8) + "px";
}
canvas.addEventListener("pointerleave", () => { tip.style.display = "none"; state.hover = null; styleSelection(); });

/* ───────────── market maths for the panel ───────────── */
function marketMargin() {
  const d = sportData();
  if (state.sport !== "nfl") return null;
  const i = state.inputs, spread = parseFloat(i.spread);
  if (isFinite(spread) && String(i.spread).trim() !== "") return { margin: -spread, source: "spread" };
  const dh = parseOdds(i.mlH), da = parseOdds(i.mlA);
  if (dh && da) { const fh = (1 / dh) / (1 / dh + 1 / da); return { margin: d.sd_margin * ppf(fh), source: "moneyline" }; }
  return null;
}
function evRow(label, p, dec, fair, raw) {
  const ev = p * dec - 1, edge = fair != null ? p - fair : null;
  const cand = ev >= 0.02 && (fair == null || edge >= 0.02);
  return `<tr><td>${label}</td><td>${pct(p)}<br><span style="color:var(--muted)">raw ${pct(raw)}</span></td>
    <td>${pct(1 / dec)}${fair != null ? `<br><span style="color:var(--muted)">fair ${pct(fair)}</span>` : ""}</td>
    <td>${edge != null ? sgn(edge * 100) + "%" : "–"}</td>
    <td class="${ev >= 0 ? "pos" : "neg"}">${sgn(ev * 100)}%${cand ? '<br><span class="cand">candidate</span>' : ""}</td></tr>`;
}
const anchor = (m, mk) => state.trust * m + (1 - state.trust) * mk;

function marketHTML(pj) {
  const d = sportData(), i = state.inputs, T = d.teams, hn = T[state.home].short, an = T[state.away].short;
  let out = "", rows = "", warn = "";
  if (state.sport === "epl") {
    const g = scoreGrid(Math.max(pj.hs, .15), Math.max(pj.as, .15), 10), n = 10;
    let ph = 0, pd = 0, pBtts = 0;
    for (let a = 0; a <= n; a++) for (let b = 0; b <= n; b++) { if (a > b) ph += g[a][b]; else if (a === b) pd += g[a][b]; if (a > 0 && b > 0) pBtts += g[a][b]; }
    const pa = 1 - ph - pd, line = parseFloat(i.line) || 2.5;
    let po = 0; for (let a = 0; a <= n; a++) for (let b = 0; b <= n; b++) if (a + b > line) po += g[a][b];
    out += `<dl class="kv"><dt>Expected goals</dt><dd>${T[state.home].short} ${pj.hs.toFixed(2)} – ${pj.as.toFixed(2)} ${T[state.away].short}</dd>
      <dt>1X2 (model)</dt><dd>${pct(ph)} · ${pct(pd)} · ${pct(pa)}</dd>
      <dt>Over ${line} / BTTS</dt><dd>${pct(po)} / ${pct(pBtts)}</dd></dl>`;
    const od = [parseOdds(i.oH), parseOdds(i.oD), parseOdds(i.oA)];
    if (od.every(Boolean)) {
      const imp = od.map((x) => 1 / x), tot = imp.reduce((a, b) => a + b, 0), fair = imp.map((x) => x / tot), raw = [ph, pd, pa];
      const used = raw.map((m, k) => anchor(m, fair[k]));
      const gap = Math.max(...raw.map((m, k) => Math.abs(m - fair[k])));
      if (gap >= 0.08) warn = `The model is up to ${Math.round(gap * 100)} points from the market. The market sees lineups and injuries this team-level model cannot — find out why before trusting any edge.`;
      rows += evRow(hn + " win", used[0], od[0], fair[0], raw[0]) + evRow("Draw", used[1], od[1], fair[1], raw[1]) + evRow(an + " win", used[2], od[2], fair[2], raw[2]);
    }
    const ou = [parseOdds(i.ouO), parseOdds(i.ouU)];
    if (ou.every(Boolean)) {
      const fo = (1 / ou[0]) / (1 / ou[0] + 1 / ou[1]), p = anchor(po, fo);
      rows += evRow(`Over ${line}`, p, ou[0], fo, po) + evRow(`Under ${line}`, 1 - p, ou[1], 1 - fo, 1 - po);
    }
  } else {
    const sd = d.sd_margin, margin = pj.hs - pj.as, total = pj.hs + pj.as;
    const mm = marketMargin(), used = mm ? anchor(margin, mm.margin) : margin;
    const totalLine = parseFloat(i.total), usedTotal = isFinite(totalLine) ? anchor(total, totalLine) : total;
    const pHraw = cdf(margin / sd), pH = cdf(used / sd);
    out += `<dl class="kv"><dt>Projected score</dt><dd>${hn} ${pj.hs.toFixed(1)} – ${pj.as.toFixed(1)} ${an}</dd>
      <dt>Margin / total</dt><dd>${sgn(margin)} / ${total.toFixed(1)}</dd>
      <dt>${hn} win (model)</dt><dd>${pct(pHraw)}</dd>
      ${mm ? `<dt>Market margin (${mm.source})</dt><dd>${sgn(mm.margin)}</dd><dt>Anchored margin</dt><dd>${sgn(used)} → ${hn} win ${pct(pH)}</dd>` : ""}</dl>`;
    if (mm && Math.abs(margin - mm.margin) >= 3.5)
      warn = `The model is ${Math.abs(margin - mm.margin).toFixed(1)} points from the market. The market sees injuries, QB news and matchups this team-level model cannot — find out why before trusting any edge.`;
    const sp = parseFloat(i.spread);
    if (isFinite(sp) && String(i.spread).trim() !== "") {
      const dec = parseOdds(i.spreadOdds) || parseOdds("-110"), p = cdf((used + sp) / sd), raw = cdf((margin + sp) / sd);
      rows += evRow(`${hn} ${sp > 0 ? "+" : ""}${sp}`, p, dec, null, raw) + evRow(`${an} ${-sp > 0 ? "+" : ""}${-sp}`, 1 - p, dec, null, 1 - raw);
    }
    if (isFinite(totalLine)) {
      const dec = parseOdds(i.totalOdds) || parseOdds("-110"), p = pOver(totalLine, usedTotal, d.sd_total), raw = pOver(totalLine, total, d.sd_total);
      rows += evRow(`Over ${totalLine}`, p, dec, null, raw) + evRow(`Under ${totalLine}`, 1 - p, dec, null, 1 - raw);
    }
    const dh = parseOdds(i.mlH), da = parseOdds(i.mlA);
    if (dh && da) {
      const fh = (1 / dh) / (1 / dh + 1 / da);
      rows += evRow(hn + " ML", pH, dh, fh, pHraw) + evRow(an + " ML", 1 - pH, da, 1 - fh, 1 - pHraw);
    }
  }
  if (warn) out += `<div class="warn">⚠ ${warn}</div>`;
  if (rows) out += `<div class="tw"><table><thead><tr><th>Bet</th><th>Model</th><th>Book</th><th>Edge</th><th>EV</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note">Probabilities are blended ${Math.round(state.trust * 100)}% model / ${Math.round((1 - state.trust) * 100)}% market. “Candidate” = at least +2% edge and EV. Not a bet recommendation: check lineups and injuries first.</p>`;
  else out += `<p class="note">Enter market prices above to compare the model with the book.</p>`;
  return out;
}

/* ───────────── side panel ───────────── */
const panel = document.getElementById("panel");
function teamOptions(sel) {
  return `<option value="">Select…</option>` + teamList().sort((a, b) => a.name.localeCompare(b.name))
    .map((t) => `<option value="${t.id}"${t.id === sel ? " selected" : ""}>${t.name}</option>`).join("");
}
function renderPanel() {
  const d = sportData();
  document.getElementById("meta").innerHTML =
    `${d.label} ${d.season} · ${d.games} games · snapshot ${SNAP.generated}<br><button class="btn" id="load" type="button">Load newer snapshot…</button> <input id="file" type="file" accept="application/json" hidden>`;
  document.getElementById("load").onclick = () => document.getElementById("file").click();
  document.getElementById("file").onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { const j = JSON.parse(await f.text()); if (!j.sports) throw 0; SNAP = j; state.home = state.away = null; refresh(); }
    catch { alert("That file is not a ratings snapshot (expected the JSON from `team_ratings.py snapshot`)."); }
  };
  if (state.view === "land") { panel.innerHTML = tableHTML(); wireTable(); }
  else { panel.innerHTML = matchupPanelHTML(); wireMatchup(); }
}
function tableHTML() {
  const d = sportData(), rows = teamList(), { key, dir } = state.sort;

  const th = (k, label) => `<th data-k="${k}" ${state.sort.key === k ? `aria-sort="${dir > 0 ? "ascending" : "descending"}"` : ""} tabindex="0">${label}${state.sort.key === k ? (dir > 0 ? " ▲" : " ▼") : ""}</th>`;

      <td>${t.name}</td><td>${t.gp}</td><td>${num(t.off)}</td><td>${num(t.def)}</td><td>${num(t.net)}</td></tr>`).join("")}</tbody></table></div>
    <p class="note"><span class="swatch" style="background:var(--home)"></span>home pick &nbsp; <span class="swatch" style="background:var(--away)"></span>away pick. Click two teams (in the chart or here), then open <b>Matchup</b>.</p>
    <p class="note">Ratings come from every result so far, adjusted for opponent strength, and start from last season's until enough games are played. Home/away form is shrunk almost to zero because backtests showed it adds noise, not signal.</p>`;

}

function wireMatchup() {
  const upd = () => { buildMatchup(); document.getElementById("result").innerHTML = resultHTML(); };
  document.getElementById("selH").onchange = (e) => { state.home = e.target.value || null; renderPanel(); buildMatchup(); };
  document.getElementById("selA").onchange = (e) => { state.away = e.target.value || null; renderPanel(); buildMatchup(); };
  panel.querySelectorAll("input[data-in]").forEach((el) => el.oninput = () => { state.inputs[el.dataset.in] = el.value; upd(); });
  const nt = document.getElementById("neutral"); if (nt) nt.onchange = () => { state.inputs.neutral = nt.checked; upd(); };
  document.getElementById("trust").oninput = (e) => { state.trust = e.target.value / 100; document.getElementById("trustv").textContent = e.target.value + "%"; upd(); };
  document.getElementById("result").innerHTML = resultHTML();
}
function resultHTML() {
  const { home, away } = state;
  if (!home || !away) return `<p class="note">Choose a home and an away team.</p>`;
  if (home === away) return `<p class="note">Home and away must be different teams.</p>`;
  const d = sportData(), neutral = !!state.inputs.neutral;
  const pj = project(home, away, neutral), th = d.teams[home], ta = d.teams[away];
  return `<dl class="kv"><dt>${th.name}</dt><dd>net ${sgn(th.off - th.dfn, 2)} · ${th.gp} GP</dd><dt>${ta.name}</dt><dd>net ${sgn(ta.off - ta.dfn, 2)} · ${ta.gp} GP</dd></dl>` + marketHTML(pj);
}

/* ───────────── wiring ───────────── */
function refresh() {
  if (!renderer) { renderPanel(); return; }
  if (state.view === "land") { Object.assign(cam, { theta: 0.75, phi: 0.95, radius: 17 }); cam.target.set(0, 0.6, 0); buildLandscape(); }
  else { Object.assign(cam, state.sport === "nfl" ? { theta: 0.3, phi: 1.1, radius: 21 } : { theta: 0.75, phi: 0.95, radius: 13 }); buildMatchup(); }
  renderPanel();
}
function setPressed(ids, on) { ids.forEach((id) => document.getElementById(id).setAttribute("aria-pressed", String(id === on))); }
document.getElementById("sp-epl").onclick = () => { state.sport = "epl"; state.home = state.away = null; setPressed(["sp-epl", "sp-nfl"], "sp-epl"); refresh(); };
document.getElementById("sp-nfl").onclick = () => { state.sport = "nfl"; state.home = state.away = null; setPressed(["sp-epl", "sp-nfl"], "sp-nfl"); refresh(); };
document.getElementById("v-land").onclick = () => { state.view = "land"; setPressed(["v-land", "v-match"], "v-land"); refresh(); };
document.getElementById("v-match").onclick = () => { state.view = "match"; setPressed(["v-land", "v-match"], "v-match"); refresh(); };

window.addEventListener("resize", resize);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { refresh(); });

function frame() {
  if (renderer && dirty) {
    dirty = false;
    renderer.setClearColor(col("--bg"));
    applyCam(); renderer.render(scene, camera); placeLabels();
  }
  requestAnimationFrame(frame);
}
if (typeof THREE === "undefined") {
  document.getElementById("fallback").style.display = "flex";
  document.getElementById("fallback").textContent = "Could not load three.js (offline?). The ratings table on the right still works.";
  canvas.style.display = "none"; renderPanel();
} else {
  initGL();
  refresh();
  frame();
}
window.__ratings = { state, project };   // handy for debugging in the console
})();
</script>
</body>
</html>
